<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Standard Camera AR - Live Experience</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }

    /* カメラ映像ビュー */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* ARオーバーレイCanvas */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    /* 構図調整用グリッド線 */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }
    #grid-overlay div {
      border: 0.5px solid rgba(255, 255, 255, 0.25);
    }

    /* 上部標準カメラツールバー */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }
    .icon-btn {
      background: rgba(30, 30, 30, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      outline: none;
    }
    .icon-btn.active {
      background: rgba(255, 215, 0, 0.8);
      color: #000;
    }

    /* 操作ガイド通知 */
    #guide-toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 0.05em;
      z-index: 10;
      pointer-events: none;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      transition: opacity 0.5s ease;
    }

    /* 下部カメラコントロール（標準カメラ風） */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px 40px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    }

    /* リセットボタン */
    #reset-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 標準シャッターボタン */
    #shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: transparent;
      border: 4px solid #ffffff;
      padding: 4px;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }
    #shutter-btn-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      transition: background 0.15s ease;
    }
    #shutter-btn:active #shutter-btn-inner {
      background: #dddddd;
      transform: scale(0.92);
    }

    /* 撮影結果サムネイル */
    #thumbnail-preview {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.8);
      background-size: cover;
      background-position: center;
      background-color: rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- ARインタラクティブCanvas -->
  <canvas id="ar-canvas"></canvas>

  <!-- カメラグリッド -->
  <div id="grid-overlay">
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
  </div>

  <!-- 上部ツールバー -->
  <div id="top-bar">
    <button class="icon-btn" id="flip-cam-btn" title="カメラ切替">🔄</button>
    <button class="icon-btn active" id="effect-btn" title="ライブ演出ON/OFF">✨</button>
    <button class="icon-btn" id="grid-btn" title="グリッド切替">▦</button>
  </div>

  <!-- ガイド通知 -->
  <div id="guide-toast">1本指で移動 / 2本指で拡大・回転</div>

  <!-- 下部コントロール -->
  <div id="bottom-bar">
    <div id="reset-btn" title="位置リセット">配置リセット</div>
    <div id="shutter-btn">
      <div id="shutter-btn-inner"></div>
    </div>
    <div id="thumbnail-preview"></div>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipCamBtn = document.getElementById('flip-cam-btn');
    const effectBtn = document.getElementById('effect-btn');
    const gridBtn = document.getElementById('grid-btn');
    const gridOverlay = document.getElementById('grid-overlay');
    const resetBtn = document.getElementById('reset-btn');
    const thumbPreview = document.getElementById('thumbnail-preview');

    let dpr = window.devicePixelRatio || 1;
    let logicalWidth, logicalHeight;
    let currentFacingMode = 'environment'; // 'environment' (背面) または 'user' (前面)
    let isEffectActive = true;

    // --- ARオブジェクト（男性画像）のトランスフォーム状態 ---
    let objTransform = {
      x: 0,
      y: 0,
      scale: 1.0,
      rotation: 0 // ラジアン
    };

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      logicalWidth = window.innerWidth;
      logicalHeight = window.innerHeight;

      arCanvas.width = logicalWidth * dpr;
      arCanvas.height = logicalHeight * dpr;
      arCanvas.style.width = logicalWidth + 'px';
      arCanvas.style.height = logicalHeight + 'px';

      ctx.scale(dpr, dpr);

      // デフォルト位置を画面中央下寄りにセット
      if (objTransform.x === 0 && objTransform.y === 0) {
        resetObjectTransform();
      }
    }
    window.addEventListener('resize', resizeCanvas);

    function resetObjectTransform() {
      objTransform.x = logicalWidth / 2;
      objTransform.y = logicalHeight * 0.6;
      objTransform.scale = 1.0;
      objTransform.rotation = 0;
    }

    // カメラ起動処理
    async function initCamera() {
      if (webcamEl.srcObject) {
        webcamEl.srcObject.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        webcamEl.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          webcamEl.srcObject = fallbackStream;
        } catch (e) {
          console.error("Camera access failed:", e);
        }
      }
    }
    initCamera();

    // 画像読み込み ＆ 背景（白系）透過処理
    let processedFrameImg = null;
    function loadAndProcessFrame() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        // 背景の白〜ライトグレー部分を自動でクリア（透明化）
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          if (r > 205 && g > 205 && b > 205) {
            data[i+3] = 0;
          }
        }
        tempCtx.putImageData(imgData, 0, 0);
        processedFrameImg = tempCanvas;
      };
      img.onerror = () => {
        if (!img.src.endsWith('1.jpg')) img.src = '1.jpg';
      };
      img.src = '1.png';
    }
    loadAndProcessFrame();

    // ライブ風演出パーティクル
    const particles = [];
    for (let i = 0; i < 25; i++) {
      particles.push({
        type: 'petal',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 8 + 6,
        speedY: Math.random() * 1.2 + 0.6,
        speedX: (Math.random() - 0.5) * 1.0,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 1.8,
        swaySpeed: Math.random() * 0.01 + 0.005,
        swayAmp: Math.random() * 25 + 10,
        initialX: Math.random() * window.innerWidth,
        opacity: Math.random() * 0.4 + 0.6
      });
    }

    let timeCount = 0;

    // メイン描画ループ
    function renderLoop() {
      timeCount += 0.02;
      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- A. ライブ風ステージスポットライト（ON時のみ） ---
      if (isEffectActive) {
        ctx.save();
        const spotGrad = ctx.createRadialGradient(
          logicalWidth / 2, 0, 10,
          logicalWidth / 2, 0, logicalHeight * 0.8
        );
        spotGrad.addColorStop(0, 'rgba(255, 0, 128, 0.2)');
        spotGrad.addColorStop(0.6, 'rgba(0, 200, 255, 0.1)');
        spotGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = spotGrad;
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        ctx.restore();
      }

      // --- B. 男性画像（ARオブジェクト）の描画（位置・回転・拡大縮小適用） ---
      if (processedFrameImg) {
        ctx.save();
        ctx.translate(objTransform.x, objTransform.y);
        ctx.rotate(objTransform.rotation);

        const baseW = Math.min(logicalWidth * 0.7, 400) * objTransform.scale;
        const baseH = baseW * (processedFrameImg.height / processedFrameImg.width);

        if (isEffectActive) {
          ctx.shadowColor = 'rgba(255, 0, 128, 0.6)';
          ctx.shadowBlur = 25;
        }

        // 中心点を軸にして描画
        ctx.drawImage(processedFrameImg, -baseW / 2, -baseH / 2, baseW, baseH);
        ctx.restore();
      }

      // --- C. パーティクル演出（ON時のみ） ---
      if (isEffectActive) {
        particles.forEach(p => {
          p.y += p.speedY;
          p.x = p.initialX + Math.sin(p.y * p.swaySpeed) * p.swayAmp;
          p.rotation += p.rotSpeed;

          if (p.y > logicalHeight + 20) {
            p.y = -20;
            p.initialX = Math.random() * logicalWidth;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = '#ffb7c5';
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      requestAnimationFrame(renderLoop);
    }

    resizeCanvas();
    renderLoop();

    // --- インタラクティブタッチ操作（ドラッグ移動 / ピンチ拡大縮小・回転） ---
    let touchState = {
      isDragging: false,
      startX: 0,
      startY: 0,
      initialObjX: 0,
      initialObjY: 0,
      initialDist: 0,
      initialScale: 1.0,
      initialAngle: 0,
      initialRotation: 0
    };

    function getTouchDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    function getTouchAngle(t1, t2) {
      return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#top-bar') || e.target.closest('#bottom-bar')) return;

      if (e.touches.length === 1) {
        // 1本指ドラッグ移動開始
        touchState.isDragging = true;
        touchState.startX = e.touches[0].clientX;
        touchState.startY = e.touches[0].clientY;
        touchState.initialObjX = objTransform.x;
        touchState.initialObjY = objTransform.y;
      } else if (e.touches.length === 2) {
        // 2本指ピンチ拡大・縮小＆回転開始
        touchState.isDragging = false;
        touchState.initialDist = getTouchDistance(e.touches[0], e.touches[1]);
        touchState.initialScale = objTransform.scale;
        touchState.initialAngle = getTouchAngle(e.touches[0], e.touches[1]);
        touchState.initialRotation = objTransform.rotation;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('#top-bar') || e.target.closest('#bottom-bar')) return;

      if (e.touches.length === 1 && touchState.isDragging) {
        const deltaX = e.touches[0].clientX - touchState.startX;
        const deltaY = e.touches[0].clientY - touchState.startY;
        objTransform.x = touchState.initialObjX + deltaX;
        objTransform.y = touchState.initialObjY + deltaY;
      } else if (e.touches.length === 2 && touchState.initialDist > 0) {
        // 拡大縮小
        const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
        const scaleFactor = currentDist / touchState.initialDist;
        objTransform.scale = Math.max(0.3, Math.min(3.0, touchState.initialScale * scaleFactor));

        // 回転
        const currentAngle = getTouchAngle(e.touches[0], e.touches[1]);
        const deltaAngle = currentAngle - touchState.initialAngle;
        objTransform.rotation = touchState.initialRotation + deltaAngle;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      touchState.isDragging = false;
      touchState.initialDist = 0;
    });

    // --- カメラ＆UI機能のイベントハンドラ ---

    // イン/アウトカメラ切り替え
    flipCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    });

    // ライブ演出ON/OFF切替
    effectBtn.addEventListener('click', () => {
      isEffectActive = !isEffectActive;
      effectBtn.classList.toggle('active', isEffectActive);
    });

    // グリッド切替
    gridBtn.addEventListener('click', () => {
      const isGridVisible = gridOverlay.style.display === 'grid';
      gridOverlay.style.display = isGridVisible ? 'none' : 'grid';
      gridBtn.classList.toggle('active', !isGridVisible);
    });

    // 人物配置のリセット
    resetBtn.addEventListener('click', () => {
      resetObjectTransform();
    });

    // シャッター機能（撮影＆保存）
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像を合成
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vRatio = webcamEl.videoWidth / webcamEl.videoHeight;
        const cRatio = logicalWidth / logicalHeight;
        let w = logicalWidth, h = logicalHeight, x = 0, y = 0;
        if (vRatio > cRatio) {
          w = logicalHeight * vRatio;
          x = (logicalWidth - w) / 2;
        } else {
          h = logicalWidth / vRatio;
          y = (logicalHeight - h) / 2;
        }

        // 自撮り（前面カメラ）時の左右反転対応
        if (currentFacingMode === 'user') {
          saveCtx.save();
          saveCtx.translate(logicalWidth, 0);
          saveCtx.scale(-1, 1);
          saveCtx.drawImage(webcamEl, x, y, w, h);
          saveCtx.restore();
        } else {
          saveCtx.drawImage(webcamEl, x, y, w, h);
        }
      }

      // 2. AR演出（男性画像・パーティクル）を重ねて合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. サムネイルのプレビュー更新 ＆ 保存処理
      const dataUrl = saveCanvas.toDataURL('image/png', 1.0);
      thumbPreview.style.backgroundImage = `url(${dataUrl})`;

      const link = document.createElement('a');
      link.download = 'ar_photo_' + Date.now() + '.png';
      link.href = dataUrl;
      link.click();
    });
  </script>
</body>
</html>
